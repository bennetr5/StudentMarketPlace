<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="/home">Back to Home</a></div>
    </nav>

    <div id="slideMenu" class="slide-menu">
        <a href="/home">Marketplace</a>
        <a href="/profile">My Listings</a>
        <a href="/sell">List an Item</a>
        <form action="/logout" method="POST">
            <button type="submit">Logout</button>
        </form>
    </div>

    <div style="max-width: 800px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
        <h1 id="prodTitle">Loading...</h1>
        
        <div id="imageContainer" style="margin-bottom: 20px;">
            </div>

        <h2 id="prodPrice" style="color: green;"></h2>
        <p><strong>Type:</strong> <span id="prodType"></span></p>
        
        <h3>Description</h3>
        <p id="prodDesc"></p>

        <hr>
        
        <h3>Seller Contact</h3>
        <p><strong>Email:</strong> <a id="sellerEmail" href="#">Loading...</a></p>
    </div>

    <script>
        async function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) window.location.href = '/home';

            try {
                const res = await fetch(`/api/product?id=${id}`);
                const data = await res.json();

                if (data.error) {
                    document.body.innerHTML = "<h1>Product not found</h1>";
                    return;
                }

                // Populate fields
                document.getElementById('prodTitle').innerText = data.title;
                document.getElementById('prodPrice').innerText = `$${data.price}`;
                document.getElementById('prodType').innerText = data.type;
                document.getElementById('prodDesc').innerText = data.description;
                
                // Handle Seller Email
                if (data.seller && data.seller.email) {
                    const emailLink = document.getElementById('sellerEmail');
                    emailLink.innerText = data.seller.email;
                    emailLink.href = `mailto:${data.seller.email}`;
                } else {
                    document.getElementById('sellerEmail').innerText = "Contact info unavailable";
                }

                // Handle Image
                const imgContainer = document.getElementById('imageContainer');
                if (data.images && data.images.length > 0) {
                    // Just showing the first image for now
                    imgContainer.innerHTML = `<img src="${data.images[0]}" style="max-width: 100%; max-height: 400px;">`;
                } else {
                    imgContainer.innerHTML = `<p>No image available</p>`;
                }

            } catch (err) {
                console.error(err);
            }
        }

        loadProduct();
    </script>
</body>
</html>
