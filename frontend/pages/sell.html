<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List an Item</title>
    <link rel="stylesheet" href="../css/style.css">
    <script type="text/javascript" src="../js/validate.js"></script>
</head>

<body>
    <h1>Sell an Item</h1>
    <ul>
        <li>
            <a href="./home.html" class="button-class"> Home </a>
        </li>
        <li>
            <a href="./profile.html" class="button-class"> Profile </a>
        </li>
        <li>
            <a href="./sell.html" class="button-class"> List </a>
        </li>
        <li>
            <a href="./login.html" class="button-class"> Logout </a>
        </li>
    </ul>
    <br><br><br>
    <form action="" method="POST" onsubmit="return validateListing(this);">
        Product Name: <input type="text" name="itemName" id="itemNameID">
        <br><br>
        Product Description: 
        <br><br>
        <textarea style="resize: none;" rows="10" cols="40" placeholder="Enter a short description here" name="itemDesc" id="itemDescID"></textarea>
        <span style="font-size: 12px" id="charCount">0/200</span>
        <script>
            const chars = document.getElementById("charCount")
            const desc = document.getElementById("itemDescID")
            desc.addEventListener("input", function(){
                chars.innerText = desc.value.length + "/200"
                if (desc.value.length > 200) {
                    chars.style.color = "red"
                }
                else {
                    chars.style.color = "black"
                }
            })
        </script>
        <br><br>
        Product Type: <select name="itemType" id="typeID">
            <option value=""></option>
            <option value="Electronic">Electronic</option>
            <option value="Book">Book</option>
            <option value="Pens/Pencil">Pens/Pencil</option>
            <option value="Dorm">Dorm</option>
            <option value="Other">Other</option>
        </select>
        <br><br>
        Price: <input type="text" placeholder="0.00" name="price" id="priceID">
        <input type="submit" value="List Item">
    </form>
</body>
