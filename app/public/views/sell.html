<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List an Item</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/sell">List an Item</a>
        </div>
        <div class="nav-profile">
            <img src="/profile-photo.jpg" alt="Profile" id="profilePic" class="profile-pic">
        </div>
    </nav>

    <div id="slideMenu" class="slide-menu">
        <a href="/home">Marketplace</a>
        <a href="/profile">My Listings</a>
        <form action="/logout" method="POST">
            <button type="submit">Logout</button>
        </form>
    </div>

    <br><br><br>
    
    <form onsubmit="return false;" enctype="multipart/form-data" id="sellForm">
        Upload Images <input type="file" name="images" id="imagesID" multiple>
        <br><br>
        Product Name: <input type="text" name="title" id="itemNameID">
        <br><br>
        Product Description: 
        <br><br>
        <textarea style="resize: none;" rows="10" cols="40" placeholder="Enter a short description here" name="description" id="itemDescID"></textarea>
        <span style="font-size: 12px" id="charCount">0/200</span>
        <script>
            const chars = document.getElementById("charCount")
            const desc = document.getElementById("itemDescID")
            desc.addEventListener("input", function(){
                chars.innerText = desc.value.length + "/200"
                if (desc.value.length > 200) {
                    chars.style.color = "red"
                }
                else {
                    chars.style.color = "black"
                }
            })
        </script>
        <br><br>
        Product Type: <select name="productType" id="typeID">
            <option value=""></option>
            <option value="Electronic">Electronic</option>
            <option value="Book">Book</option>
            <option value="Pens/Pencil">Pens/Pencil</option>
            <option value="Dorm">Dorm</option>
            <option value="Other">Other</option>
        </select>
        <br><br>
        Price: <input type="text" placeholder="0.00" name="price" id="priceID">
        <input type="button" value="List Item" id="listBtn">
    </form>
    <script src="../sell.js"></script>

    <script>
        const profilePic = document.getElementById('profilePic');
        const slideMenu = document.getElementById('slideMenu');

        profilePic.addEventListener('click', function(event) {
            slideMenu.classList.toggle('open');
            event.stopPropagation();
        });

        document.addEventListener('click', function(event) {
            if (!slideMenu.contains(event.target) && event.target !== profilePic) {
                slideMenu.classList.remove('open');
            }
        });
    </script>
</body>
</html>
