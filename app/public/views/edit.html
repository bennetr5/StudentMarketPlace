<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Listing</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="/home">Marketplace</a></div>
    </nav>

    <div id="slideMenu" class="slide-menu">
        <a href="/home">Marketplace</a>
        <a href="/profile">My Listings</a>
        <a href="/sell">List an Item</a>
        <form action="/logout" method="POST">
            <button type="submit">Logout</button>
        </form>
    </div>

    <div class="form-container">
        <h2>Edit Listing</h2>
        <form id="editForm">
            <label>Title:</label>
            <input type="text" id="title" name="title" required>

            <label>Price ($):</label>
            <input type="number" id="price" name="price" step="0.01" required>

            <label>Type:</label>
            <select id="type" name="type">
                <option value="General">General</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Books">Books</option>
            </select>

            <label>Description:</label>
            <textarea id="description" name="description" rows="4"></textarea>

            <button type="submit">Save Changes</button>
            <a href="/profile" class="cancel-btn">Cancel</a>
        </form>
    </div>

    <script>
        // 1. Get Product ID from URL (e.g., /edit?id=12345)
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // 2. Fetch existing data and fill the form
        async function loadData() {
            const response = await fetch(`/api/product?id=${productId}`);
            const product = await response.json();

            if (product.error) {
                alert("Product not found");
                window.location.href = '/profile';
            }

            document.getElementById('title').value = product.title;
            document.getElementById('price').value = product.price;
            document.getElementById('type').value = product.type;
            document.getElementById('description').value = product.description;
        }

        // 3. Handle Update
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const updatedData = {
                title: document.getElementById('title').value,
                price: document.getElementById('price').value,
                type: document.getElementById('type').value,
                description: document.getElementById('description').value
            };

            const res = await fetch(`/api/product/${productId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });

            if (res.ok) {
                alert("Listing updated!");
                window.location.href = '/profile';
            } else {
                alert("Failed to update.");
            }
        });

        loadData();
    </script>
</body>
</html>
